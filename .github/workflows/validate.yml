name: Validate research repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recorded-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check navigation and recorded evidence (no models or GPU)
        run: python tools/validate_repository.py
